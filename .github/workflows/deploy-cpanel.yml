name: Build cPanel Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      BUILD_STANDALONE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:./ci.db"
      SESSION_SECRET: "ci-only-session-secret-0123456789abcdef0123456789abcdef"
      APP_URL: "https://knpimorowali.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (Linux)
        run: npx prisma generate

      - name: Build Next.js standalone
        run: npx next build --webpack

      - name: Assemble bundle
        run: |
          set -e
          rm -rf bundle
          mkdir -p bundle
          cp -a .next/standalone/. bundle/
          mkdir -p bundle/.next/static
          cp -a .next/static/. bundle/.next/static/
          rm -rf bundle/public bundle/prisma bundle/data
          cp -a public bundle/public
          mkdir -p bundle/prisma
          cp -a prisma/. bundle/prisma/
          cp app.js bundle/app.js
          cp deploy/cpanel/CPANEL.md bundle/CPANEL-DEPLOY.md
          cd bundle
          zip -qr ../knpi-morowali-standalone.zip . -x '*.map'
          cd ..
          ls -lh knpi-morowali-standalone.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: knpi-morowali-standalone
          path: knpi-morowali-standalone.zip
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deploy bundle #${{ github.run_number }}"
          files: knpi-morowali-standalone.zip
          make_latest: true
