name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:../data/ci.db"
      SESSION_SECRET: "ci-only-session-secret-0123456789abcdef0123456789abcdef"
      APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: mkdir -p data && npx prisma generate && npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
