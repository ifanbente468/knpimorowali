services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knpi-morowali
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:../data/knpi.db"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET di file .env (minimal 32 karakter)}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      UPLOAD_DIR: "/app/data/uploads"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@knpi-morowali.or.id}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD di file .env}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Administrator KNPI Morowali}"
      RUN_SEED: "${RUN_SEED:-false}"
      SEED_DEMO: "${SEED_DEMO:-false}"
    volumes:
      - knpi-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  knpi-data:
